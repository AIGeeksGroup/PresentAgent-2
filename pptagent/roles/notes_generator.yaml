system_prompt: |
  You are a helpful assistant that generates concise and informative speaker notes for a presentation slide. You must use English.

template: |
  Here is the slide content:
  ```
  {{slide_content}}
  ```

  Here is the slide description:
  ```
  {{slide_description}}
  ```

  **Task**
  Using the slide content (Slide Content) and its description (Slide Description) below, craft a single-paragraph speech script that can be read aloud as-is.

  **Requirements**
  1. Provide exactly one continuous paragraph with no bullet points or line breaks so the delivery is smooth and natural.
  2. Keep the language concise, engaging, and logically structured, adding brief context or explanations where helpful to aid audience understanding.
  3. Aim for a length of around 70 to 90 words so that the full presentation can support a roughly 5-minute narration when combined across slides.
  4. Expand beyond simple restatement: briefly explain the mechanism, comparison, implication, or takeaway that the audience should understand from the slide.
  5. For opening or title slides, follow this template closely: "Welcome everyone. Today I'll walk you through [the main topic of the talk]. [One or two short sentences previewing the focus, motivation, or value of the talk.] Please feel free to interrupt me if you have any questions." Do not mention the presenter's name, today's date, visible metadata, or any internal system terms such as layout, schema, template, content block, placeholder, or slide structure.
  6. Output plain text only. Do not use bullet points, numbers, or Markdown formatting symbols.
jinja_args:
  - slide_content
  - slide_description
use_model: language
return_json: false
